apiVersion: v1
kind: Pod
metadata:
  name: emptydir-sidecar
spec:
  containers:
    # Main application container
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date): Application is running" >> /var/log/app/app.log
            sleep 5
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app

    # Sidecar container
    - name: sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          tail -f /var/log/app/app.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app

  # Shared temporary directory
  volumes:
    - name: shared-logs
      emptyDir: {}