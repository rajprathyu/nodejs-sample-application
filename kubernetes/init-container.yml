apiVersion: v1
kind: Pod
metadata:
  name: application

spec:
  initContainers:
    - name: prepare-config
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Preparing application configuration..."

          cat > /config/app.conf <<EOF
          APP_NAME=my-application
          ENVIRONMENT=production
          LOG_LEVEL=info
          EOF

          echo "Configuration ready"

      volumeMounts:
        - name: config
          mountPath: /config

  containers:
    - name: application
      image: nginx:1.27
      volumeMounts:
        - name: config
          mountPath: /etc/myapp

  volumes:
    - name: config
      emptyDir: {}