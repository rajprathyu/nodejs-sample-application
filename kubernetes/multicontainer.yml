apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: app
      image: nginx:latest
      ports:
        - containerPort: 80

    - name: sidecar
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - while true; do echo "Sidecar is running"; sleep 10; done